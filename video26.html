<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS object Fit and position</title>
    <style>
        .container{
            height: 500px;
            width: 488px;
            border: 2px solid black;
          /*  background-color: azure;  */
          /* background-color: center center; */
            background-image: url("image4.png.jpeg");
            background-repeat:no repeat ;
        }
        img{
            width: 480px;
            height: 488px;
            object-fit:contain;
            object-position:10px 20px;
            object-fit: fill;
        }

    </style>
</head>
<body>
    <div class="container">
          
        


    </div>
</body>
</html>
